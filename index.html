<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#102b45">
<title>半導体業界ダイジェスト</title>
<style>
:root{color-scheme:light;--ink:#172638;--muted:#617184;--line:#dce4ec;--blue:#173d60;--surface:#fff;--bg:#f2f5f8;--accent:#146e75}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}header{background:linear-gradient(135deg,#102b45,#1f526b);color:white;padding:26px 18px 22px}header .wrap,main{max-width:820px;margin:auto}header p{margin:5px 0 0;color:#d7e6ee;font-size:14px}.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#acd5dc}h1{font-size:24px;line-height:1.25;margin:5px 0}main{padding:16px 14px 52px}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:0 0 16px;color:var(--muted);font-size:13px}.button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;color:var(--blue);font-weight:650}.group{margin:18px 0}.group h2{font-size:15px;margin:0 0 8px;color:#42566a}.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:9px 0;overflow:hidden;box-shadow:0 2px 5px #18334a0a}.card summary{list-style:none;cursor:pointer;padding:15px 46px 15px 15px;font-weight:700;line-height:1.45;position:relative}.card summary::-webkit-details-marker{display:none}.card summary:after{content:"＋";position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:19px;color:var(--accent)}.card[open] summary:after{content:"−"}.detail{border-top:1px solid var(--line);padding:7px 16px 16px}.detail p{margin:10px 0}.detail ul{padding-left:21px}.detail li{margin:6px 0}.detail h4{font-size:15px;margin:14px 0 5px}.detail a{color:#075b8c;overflow-wrap:anywhere}.checkrow{display:flex;align-items:center;gap:9px;border-top:1px dashed var(--line);margin-top:14px;padding-top:12px;color:#40576a;font-size:14px}.checkrow input{width:20px;height:20px;accent-color:var(--accent)}.status{font-size:12px;color:#e2f5f1}.empty{background:white;border:1px solid var(--line);border-radius:14px;padding:20px;color:var(--muted)}.note{font-size:12px;color:var(--muted);margin:18px 3px}footer{text-align:center;color:var(--muted);font-size:12px;padding:18px}
</style>
<link rel="manifest" href="manifest.json">
</head>
<body>
<header><div class="wrap"><div class="eyebrow">社内向け · Semiconductor brief</div><h1>半導体業界ダイジェスト</h1><p id="subtitle">公開情報を読み込んでいます…</p></div></header>
<main><div class="toolbar"><span id="updated">読み込み中</span><button class="button" id="reload" type="button">更新</button></div><div id="content" aria-live="polite"></div><p class="note">チェック状態はこの端末のブラウザーに保存されます。ほかの人のチェック状況は表示されません。</p></main><footer>Markdownを読み込んで表示しています</footer>
<script>
const reportUrl='./report.md';
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function inline(s){let out=esc(s);out=out.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');out=out.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');return out}
function blocks(lines){let html='',list=false;for(const line of lines){if(/^\s*[-*]\s+/.test(line)){if(!list){html+='<ul>';list=true}html+='<li>'+inline(line.replace(/^\s*[-*]\s+/,''))+'</li>';continue}if(list){html+='</ul>';list=false}if(!line.trim())continue;if(/^####\s+/.test(line)){html+='<h4>'+inline(line.replace(/^####\s+/,''))+'</h4>';continue}if(/^\|/.test(line))continue;html+='<p>'+inline(line)+'</p>'}if(list)html+='</ul>';return html}
function parse(md){const lines=md.replace(/^\uFEFF/,'').split(/\r?\n/);const groups=[];let group={name:'公開情報',items:[]},item=null,body=[];const flush=()=>{if(item){item.body=body;group.items.push(item);item=null;body=[]}};for(const line of lines){if(/^##\s+/.test(line)){flush();if(group.items.length||groups.length)groups.push(group);group={name:line.replace(/^##\s+/,''),items:[]};continue}if(/^###\s+/.test(line)){flush();item={title:line.replace(/^###\s+/,''),body:[]};continue}if(item)body.push(line);else if(line.trim()&&!line.startsWith('#')){if(!group.intro)group.intro=[];group.intro.push(line)}}flush();if(group.items.length||group.intro?.length)groups.push(group);return groups}
function paint(md){const root=document.querySelector('#content');const groups=parse(md);let index=0;root.innerHTML=groups.map(g=>{const intro=g.intro?.length?'<div class="empty">'+blocks(g.intro)+'</div>':'';const cards=g.items.map(it=>{const id='item-'+(index++);const checked=localStorage.getItem('read:'+it.title)==='1';return '<details class="card"><summary>'+inline(it.title)+'</summary><div class="detail">'+blocks(it.body)+'<label class="checkrow"><input type="checkbox" data-key="'+esc(it.title)+'" '+(checked?'checked':'')+'>確認しました</label></div></details>'}).join('');return '<section class="group"><h2>'+inline(g.name)+'</h2>'+intro+cards+'</section>'}).join('');root.querySelectorAll('input[type=checkbox]').forEach(input=>input.addEventListener('change',()=>localStorage.setItem('read:'+input.dataset.key,input.checked?'1':'0')));const title=md.match(/^- 対象期間:\s*(.+)$/m);document.querySelector('#subtitle').textContent=title?'公開情報をタップして詳細・出典を確認 · '+title[1]:'公開情報をタップして詳細・出典を確認';document.querySelector('#updated').textContent='最終読み込み '+new Intl.DateTimeFormat('ja-JP',{hour:'2-digit',minute:'2-digit'}).format(new Date())}
async function load(){try{const r=await fetch(reportUrl+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('report.md が見つかりません');paint(await r.text())}catch(e){document.querySelector('#content').innerHTML='<div class="empty">'+esc(e.message)+'。ページと同じ場所に report.md を配置してください。</div>'}}
document.querySelector('#reload').addEventListener('click',load);load();setInterval(load,60000);if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
